name: Build SHAHZAIB-ROOM Android APK

on:
  push:
    branches:
      - native-app/shahzaib-room-expo
    paths:
      - 'apps/shahzaib-room/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build native Android APK
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    defaults:
      run:
        working-directory: apps/shahzaib-room
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/shahzaib-room/package.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK components
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Align Expo package versions
        run: npx expo install --fix

      - name: Verify Expo autolinking metadata
        run: npx expo-modules-autolinking resolve --platform android

      - name: Generate native Android project
        env:
          CI: "1"
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SHAHZAIB-ROOM-android-apk
          path: apps/shahzaib-room/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
